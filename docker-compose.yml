name: personal-site

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_site}
      POSTGRES_USER: ${POSTGRES_USER:-personal_site}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_site_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personal_site} -d ${POSTGRES_DB:-personal_site}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personal_network

  api:
    build:
      context: ../personal-site-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-personal_site};Username=${POSTGRES_USER:-personal_site};Password=${POSTGRES_PASSWORD:-personal_site_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - personal_network

  frontend:
    container_name: personal_site_web
    build:
      context: ../personal-site-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080
      Admin__Password: ${ADMIN_PASSWORD:-SerkanBlog2026!}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      - api
    networks:
      - personal_network

  mobile-web:
    profiles:
      - mobile-web
    build:
      context: ../personal-site-mobile
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5082:80"
    depends_on:
      - api
    networks:
      - personal_network

volumes:
  postgres_data:

networks:
  personal_network:
    name: personal_network
    driver: bridge