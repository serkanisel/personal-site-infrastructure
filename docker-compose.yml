name: personal-site

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personal_site
      POSTGRES_USER: personal_site
      POSTGRES_PASSWORD: personal_site_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_site -d personal_site"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../personal-site-backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=personal_site;Username=personal_site;Password=personal_site_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../personal-site-frontend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080
    ports:
      - "8081:8080"
    depends_on:
      - api

  mobile-web:
    profiles:
      - mobile-web
    build:
      context: ../personal-site-mobile
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - api

volumes:
  postgres_data:
